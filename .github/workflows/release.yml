name: Publish signed Shree update

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Require Windows code-signing certificate
        shell: pwsh
        run: |
          if (-not $env:CSC_LINK -or -not $env:CSC_KEY_PASSWORD) {
            throw "Public releases require CSC_LINK and CSC_KEY_PASSWORD repository secrets."
          }
      - run: npm ci
      - run: uv sync --project backend --locked
      - run: npm run release:verify
      - run: npm run build
      - run: npm run build:backend
      - name: Build and publish installer plus update metadata
        shell: pwsh
        run: |
          $parts = $env:GITHUB_REPOSITORY.Split('/')
          npx.cmd electron-builder --win nsis --publish always `
            -c.publish.provider=github `
            -c.publish.owner=$($parts[0]) `
            -c.publish.repo=$($parts[1])
